# 复制为 settings.yaml 后填写
origin:
  name: "广州五山"
  # 高德 GCJ-02 坐标，华南理工大学五山校区附近
  location: "113.346,23.155"

constraints:
  max_drive_minutes: 120
  min_lodging_capacity: 100
  min_meeting_rooms: 2
  room_capacity_min: 10
  room_capacity_max: 15
  min_entertainment_classes: 2
  target_candidates: 10
  expand_rounds: 2

amap:
  # 高德开放平台 Web 服务 Key（必须，免费申请）
  key: ""
  qps: 3

ctrip:
  # 可选：浏览器 Cookie，降低风控；留空则走公开页面
  cookie: ""

xiaohongshu:
  # 可选：小红书 Cookie；留空则只用种子库+高德扩搜
  cookie: ""
  enabled: false

llm:
  # 可选：OpenAI 兼容接口，用于小红书抽取与会议设施文本解析
  base_url: ""
  api_key: ""
  model: ""
