upstream quote_servers {
    least_conn;               # srv-quote 可水平扩容，最小连接优先
    server srv-quote:8080;
}
upstream policy_servers {
    server srv-policy:8080;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # ---- 报价域（多副本负载均衡） ----
    location /api/tariff {
        proxy_pass http://quote_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- 政策域（SSE 流式问答：关闭缓冲，长连接） ----
    location /api/chat {
        proxy_pass http://policy_servers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/api/(doc|spider|eval) {
        proxy_pass http://policy_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- 健康检查（走 quote 副本） ----
    location /health {
        proxy_pass http://quote_servers;
        proxy_set_header Host $host;
    }

    # ---- 前端静态资源（SPA fallback） ----
    location /assets/ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}