[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "frontend",
    ".venv",
    ".git",
]

[tool.ruff.lint]
# 精选规则：F=pyflakes(未定义/未使用/重复定义) E4/E7=缩进与语句 E9=运行错误
# 有意不含样式类(E1-E3,E5,W) 与前向兼容类(I,UP)，避免大改历史代码风格。
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# 说明：scripts/ 与 tests/ 不再整目录豁免（F401/F841/E402/E701/E741/F821 已清零）。
# chat_service/__init__.py：logger 必须先于子模块 import 初始化（get_logger 配置
# 全局 handler，子模块 import 时即产生日志），import 顺序无法调整，单文件保留 E402。
"service/chat_service/__init__.py" = ["E402"]