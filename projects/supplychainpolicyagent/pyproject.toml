[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "frontend",
    ".venv",
    ".git",
]

[tool.ruff.lint]
# 精选规则：F=pyflakes(未定义/未使用/重复定义) E4/E7=缩进与语句 E9=运行错误
# 有意不含样式类(E1-E3,E5,W) 与前向兼容类(I,UP)，避免大改历史代码风格。
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# 独立脚本/临测工具：多为 sys.path 注入后 import 的既有模式，豁免风格类
# （F401/F841/E402/E701/E741 只影响脚本可读性，不影响运行正确性）
"scripts/*.py" = ["F401", "F841", "E402", "E701", "E741"]
# 新增交付脚本保持严格门禁（覆盖上面的历史脚本豁免）
"scripts/p6_inflate_data.py" = []
"scripts/p6_load_test.py" = []
"tests/*_test.py" = ["E402", "E701", "E741", "F401", "F841", "F821"]
"tests/*.py" = ["E402", "E701", "E741", "F401", "F841", "F821"]
"service/chat_service/__init__.py" = ["E402"]