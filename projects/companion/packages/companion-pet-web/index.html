<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>星澜 · VRM 桌宠</title>
    <style>
      /* Everything must be transparent: the pet window is a WS_EX_LAYERED surface and the
         pure-black, fully-cleared pixels are what the click-through colour key punches out. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Microsoft YaHei", system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
      }
      #bubble {
        position: absolute;
        left: 10px;
        top: 10px;
        right: 10px;
        min-height: 56px;
        max-height: 90px;
        box-sizing: border-box;
        padding: 8px 12px;
        border-radius: 12px;
        background: rgba(13, 24, 42, 0.88);
        border: 1px solid rgba(82, 219, 220, 0.55);
        color: #d8edf6;
        font-size: 13px;
        line-height: 1.35;
        display: none;
        overflow: hidden;
      }
      #bubble.visible {
        display: block;
      }
      #banner {
        position: absolute;
        left: 8px;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(92, 22, 22, 0.94);
        border: 1px solid #ff9a9a;
        color: #ffe2e2;
        font-size: 12px;
        display: none;
        word-break: break-word;
      }
      #banner.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="canvas"></canvas></div>
    <div id="bubble"></div>
    <div id="banner"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
