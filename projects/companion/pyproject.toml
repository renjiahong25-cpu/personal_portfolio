[project]
name = "game-companion"
version = "0.3.0"
description = "Game Companion: a spectator-mode AI co-pilot that watches, explains, and nudges."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rjh-ghost" }]

dependencies = [
    "pyside6>=6.6",
    "pydantic>=2.5",
    "httpx>=0.27",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
