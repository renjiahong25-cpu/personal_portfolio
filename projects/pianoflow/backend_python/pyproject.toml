[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# `src` is a sys.path root, not a package (conftest.py and app.py both insert
# it): the top-level modules are core/, api/, services/, tasks/ inside src/.
# Declaring them explicitly is what makes `pip install -e ".[dev]"` install the
# same import layout the runtime already uses instead of guessing a layout.
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["core", "core.*", "api", "api.*", "services", "services.*", "tasks", "tasks.*"]

[project]
name = "pianoflow-backend"
version = "0.9.0"
description = "PianoFlow AI music workbench - phase 1 audio source pipeline + phase 2 analysis"
requires-python = ">=3.11"
dependencies = [
    "tornado>=6.4,<7",
    "yt-dlp>=2025.1",
    "httpx>=0.27,<1",
    "librosa>=0.11",
    "music21>=10",
    "mido>=1.3",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
# experiments/ is excluded on purpose. Those files are kept as a record of what was
# tried (see experiments/README.md): they hardcode paths from the machine they were
# written on, import each other as top-level names, and have no tests. Linting them
# would mean maintaining code nobody runs.
extend-exclude = [".aoci", ".venv", "**/experiments/**"]
# pre-commit passes filenames explicitly, and an explicit path bypasses
# extend-exclude unless this is set. Without it the hook lints experiments/ anyway.
force-exclude = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "ASYNC",# async footguns (blocking calls in coroutines)
    "BLE",  # blind excepts
    "TID",  # tidy imports
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # function call in default arg (Tornado/fastapi style)
    "RUF001",  # ambiguous unicode: this project is full of intentional CJK
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, import private helpers, shadow fixtures on purpose, and touch
# the filesystem synchronously inside async tests. Patterns are repo-root
# relative because pre-commit runs ruff from the repository root.
"**/tests/*.py" = ["S101", "SLF001", "ARG001", "ARG002", "PLC0415", "ASYNC240"]
"**/scripts/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["container", "core", "services", "tasks", "api"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
# `src` is a sys.path root (conftest.py inserts it), not a package: without
# this mypy sees every module twice, as `core.errors` and `src.core.errors`.
explicit_package_bases = true
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = "(?x)(^\\.aoci/|^frontend/|^models/)"

[tool.bandit]
exclude_dirs = ["tests", ".aoci", "frontend", "models"]
# B404/B603: yt-dlp deliberately shells out to ffmpeg post-processors.
skips = ["B404", "B603"]
