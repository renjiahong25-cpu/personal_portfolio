name: venuescout

on:
  push:
  pull_request:

# Scoped to this project so the existing root ci.yml (supplychainpolicyagent)
# keeps its own working-directory default (mirrors pianoflow-ci.yml).
defaults:
  run:
    working-directory: projects/venue-scout

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        # Core runtime subset only: no playwright / pywin32 (browser automation
        # and Word COM are Windows-local tooling, not needed for tests or lint).
        # ruff is pinned to the version the per-file-ignores in
        # projects/venue-scout/ruff.toml were validated against.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic httpx tenacity ortools rich click \
            python-docx openpyxl yaml requests pytest "ruff==0.17.0"
      - name: ruff check
        run: ruff check .
      - name: pytest
        # All tests are offline (stub AMap / in-memory fixtures); see tests/.
        run: python -m pytest tests/ -q
