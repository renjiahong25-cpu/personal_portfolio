# Playwright UI 测试：依赖 live 服务（后端 + 前端 + LLM/MySQL），
# 不进自动 CI，仅 workflow_dispatch 手动触发。
# base_url 指向可公网/内网可达的部署地址（如 nginx 8080）。
name: ui-tests

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "被测服务地址（前端入口，含 /api 代理）"
        required: true
        default: "http://127.0.0.1:8080"

defaults:
  run:
    working-directory: projects/supplychainpolicyagent/frontend

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/supplychainpolicyagent/frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Playwright UI tests
        run: npx playwright test --config playwright.config.js
        env:
          BASE_URL: ${{ inputs.base_url }}
