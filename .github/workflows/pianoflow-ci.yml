name: pianoflow

on:
  push:
  pull_request:

# Scoped to this project so the existing root ci.yml (supplychainpolicyagent)
# keeps its own working-directory default.
defaults:
  run:
    working-directory: projects/pianoflow

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/pianoflow/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: notation highlight (OSMD in jsdom)
        # The one feature that only exists in the browser: the follow-along
        # timeline. Runs the real OSMD bundle in jsdom against the fixture
        # MusicXML (frontend/tests/notation-highlight.test.mjs).
        run: node tests/notation-highlight.test.mjs
      - name: Publish dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: projects/pianoflow/frontend/dist

  backend:
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: projects/pianoflow/backend_python
    steps:
      - uses: actions/checkout@v4
      # The SPA fallback tests (test_api, test_review_fixes) serve the built
      # frontend, so the dist produced by the frontend job is restored first.
      - name: Restore frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: projects/pianoflow/frontend/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: pytest
        # No local model assets beyond the committed 230 KB basic-pitch ONNX:
        # the tests that need fluidSynth, the SoundFont, the 154 MB model or a
        # Transkun environment skip themselves (conftest / skipif marks in
        # tests/). ffmpeg ships on ubuntu-latest, so the upload path runs.
        run: python -m pytest
      - name: compileall
        run: >-
          python -c "import compileall,sys;
          sys.exit(0 if compileall.compile_dir('src', quiet=1)
          and compileall.compile_dir('tests', quiet=1)
          and compileall.compile_dir('scripts', quiet=1)
          and compileall.compile_file('app.py', quiet=1) else 1)"
